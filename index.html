<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11110f">
  <meta name="description" content="Emil Huru — digital artist, 3D artist, and storyteller.">
  <title>Emil Huru — Digital Artist</title>
  <script>
    if ('scrollRestoration' in history) {
      history.scrollRestoration = 'manual';
      const navigation = performance.getEntriesByType('navigation')[0];
      if (navigation && navigation.type === 'reload') {
        history.replaceState(null, '', location.pathname + location.search);
        window.scrollTo(0, 0);
      }
    }
  </script>
  <style>
    :root { --bg:#11110f; --fg:#f0eee8; --muted:#c5c4bd; --accent:#d6ff65; }
    * { box-sizing:border-box; }
    html { min-height:100%; scroll-behavior:smooth; }
    body { min-height:100vh; margin:0; background:var(--bg); color:var(--fg); font-family:Arial, Helvetica, sans-serif; }
    a { color:inherit; text-decoration:none; }
    .landing { position:relative; display:flex; min-height:100vh; min-height:100svh; flex-direction:column; isolation:isolate; overflow:hidden; }
    .landing-image { position:absolute; z-index:-2; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 54%; filter:brightness(.68) saturate(.9); }
    .landing::after { position:absolute; z-index:-1; inset:0; background:linear-gradient(90deg,rgba(17,17,15,.68),rgba(17,17,15,.25) 64%,rgba(17,17,15,.1)),linear-gradient(0deg,rgba(17,17,15,.72),transparent 55%); content:""; }
    .wrap { width:min(1440px, 100% - 56px); margin:auto; }
    .landing > .wrap { display:flex; flex:1; flex-direction:column; margin:0 auto; }
    header { display:flex; height:84px; align-items:center; justify-content:space-between; border-bottom:1px solid rgba(240,238,232,.22); }
    .brand { font-size:14px; font-weight:700; letter-spacing:.16em; }
    nav { display:flex; gap:30px; color:#e1dfd8; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
    nav a,.category-link { transition:color .2s,border-color .2s,background .2s; }
    nav a:hover,.category-link:hover { color:var(--accent); }
    .landing-content { display:flex; flex:1; flex-direction:column; justify-content:center; padding:72px 0 88px; }
    .eyebrow { margin:0 0 24px; color:var(--accent); font-size:11px; letter-spacing:.22em; text-transform:uppercase; }
    h1 { max-width:1000px; margin:0; font-size:clamp(29px,5.75vw,83px); font-weight:500; letter-spacing:-.085em; line-height:.84; }
    .intro { max-width:390px; margin:26px 0 38px; color:#e1dfd8; font-size:15px; line-height:1.7; }
    .category-links { display:flex; flex-wrap:wrap; gap:10px; }
    .category-link { display:inline-flex; min-height:48px; align-items:center; justify-content:space-between; gap:38px; padding:0 16px; border:1px solid rgba(240,238,232,.42); background:rgba(17,17,15,.24); font-size:11px; letter-spacing:.12em; text-transform:uppercase; }
    .category-link--featured { border-color:var(--accent); background:var(--accent); color:var(--bg); }
    .category-link--featured:hover { border-color:var(--fg); background:var(--fg); color:var(--bg); }
    .category-link--subtle:hover { border-color:var(--accent); }
    .landing-footer { display:flex; justify-content:space-between; gap:16px; padding:20px 0; border-top:1px solid rgba(240,238,232,.22); color:#d0cfc9; font-size:10px; letter-spacing:.12em; text-transform:uppercase; }
    .landing-socials { display:flex; gap:16px; }
    .landing-socials a:hover { color:var(--accent); }
    @media (max-width:700px) {
      .wrap { width:calc(100% - 32px); }
      header { height:70px; }
      nav { gap:16px; font-size:10px; }
      .brand { font-size:12px; }
      .landing-content { justify-content:flex-end; padding:80px 0 64px; }
      .intro { margin:22px 0 30px; }
      .category-links { display:grid; grid-template-columns:1fr; }
      .category-link { width:100%; }
      .landing-image { object-position:56% center; }
      .landing-footer { font-size:9px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; }
    }
  </style>
</head>
<body>
  <main class="landing" id="top">
    <img class="landing-image" src="SKOGSKRABBE.jpg" alt="" aria-hidden="true">
    <div class="wrap">
      <header>
        <a class="brand" href="index.html" aria-label="Emil Huru home">EMIL HURU</a>
        <nav aria-label="Main navigation">
          <a href="work.html#projects">Work</a>
          <a href="work.html#about">About</a>
          <a href="work.html#contact">Contact</a>
        </nav>
      </header>
      <section class="landing-content" aria-labelledby="home-title">
        <p class="eyebrow">Digital artist · 3D · Storyteller</p>
        <h1 id="home-title">EMIL HURU</h1>
        <p class="intro">Building worlds, shaping light, and telling stories through 3D and visual art.</p>
        <nav class="category-links" aria-label="Explore the portfolio">
          <a class="category-link category-link--featured" href="work.html#projects"><span>3D Projects</span><span>↗</span></a>
          <a class="category-link category-link--subtle" href="work.html#stills"><span>Still Images</span><span>↗</span></a>
          <a class="category-link category-link--subtle" href="work.html#animations"><span>Animations</span><span>↗</span></a>
        </nav>
      </section>
      <footer class="landing-footer">
        <span>© <span id="year"></span> Emil Huru</span>
        <nav class="landing-socials" aria-label="Social media">
          <a href="https://www.youtube.com/@emileliashuru" target="_blank" rel="noopener noreferrer">YouTube ↗</a>
          <a href="https://www.instagram.com/emil_vfx/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
        </nav>
        <a href="work.html">Explore the portfolio ↗</a>
      </footer>
    </div>
  </main>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
